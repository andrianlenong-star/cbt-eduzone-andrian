<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Embed uploaded glowing neon squircle icon -->
  <image href="/eduzone-logo.png" x="12" y="10" width="200" height="200" preserveAspectRatio="xMidYMid meet" />

  <!-- Modern Typography: EduZone CBT -->
  <g transform="translate(235, 95)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#0f172a" letter-spacing="-1">
      Edu<tspan fill="url(#textGrad)">Zone</tspan>
    </text>
    
    <!-- CBT Badge -->
    <rect x="250" y="-44" width="110" height="46" rx="14" fill="url(#badgeGrad)" filter="url(#neonGlow)"/>
    <text x="305" y="-12" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      CBT
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0284c7" letter-spacing="3">
      SISTEM ASESMEN &amp; UJIAN MODERN
    </text>
    <text x="2" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1">
      ANTI-CHEAT • REALTIME CCTV PROCTORING • VOIP
    </text>
  </g>
</svg>
