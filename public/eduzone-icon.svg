<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Background and Outer Glow Gradients -->
    <radialGradient id="iconAuraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>

    <!-- App Icon Box Background -->
    <linearGradient id="iconBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090a16"/>
    </linearGradient>

    <!-- App Icon Border Glow -->
    <linearGradient id="iconBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Gold Graduation Cap Gradient -->
    <linearGradient id="iconCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Neon Book Gradients -->
    <linearGradient id="iconBookCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="iconBookPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="iconNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Dark Canvas -->
  <rect width="100%" height="100%" rx="52" fill="#0b1120"/>
  <circle cx="120" cy="120" r="100" fill="url(#iconAuraGlow)"/>

  <!-- ================= ICON SQUIRCLE ================= -->
  <g transform="translate(30, 30)">
    <!-- Outer Glow Rim -->
    <rect x="0" y="0" width="180" height="180" rx="42" fill="url(#iconBoxGrad)" stroke="url(#iconBorderGrad)" stroke-width="4.5" filter="url(#iconNeonGlow)"/>

    <!-- Inner Glass Border -->
    <rect x="14" y="14" width="152" height="152" rx="30" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

    <!-- Sparkles -->
    <path d="M 38 48 Q 42 48 42 44 Q 42 48 46 48 Q 42 48 42 52 Q 42 48 38 48 Z" fill="#38bdf8" filter="url(#iconNeonGlow)"/>
    <path d="M 136 54 Q 140 54 140 50 Q 140 54 144 54 Q 140 54 140 58 Q 140 54 136 54 Z" fill="#facc15" filter="url(#iconNeonGlow)"/>
    <circle cx="34" cy="116" r="2.5" fill="#ec4899" filter="url(#iconNeonGlow)"/>
    <circle cx="148" cy="122" r="3" fill="#38bdf8" filter="url(#iconNeonGlow)"/>

    <!-- GRADUATION CAP (Golden Glowing) -->
    <g filter="url(#iconNeonGlow)">
      <!-- Cap Top Diamond -->
      <polygon points="90,44 142,65 90,82 38,65" fill="url(#iconCapGrad)" stroke="#fef08a" stroke-width="2.5"/>
      <!-- Cap Base Skullcap -->
      <path d="M 62 74 L 62 88 Q 90 102 118 88 L 118 74 Q 90 86 62 74 Z" fill="#ca8a04" stroke="#fde047" stroke-width="2"/>
      <!-- Tassel Ribbon & Bob -->
      <path d="M 90 64 Q 135 68 136 94" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="136" cy="98" r="4.5" fill="#facc15"/>
      <path d="M 134 100 L 138 100 L 140 114 L 132 114 Z" fill="#fde047"/>
    </g>

    <!-- OPEN BOOK (Neon Cyan & Magenta Glow) -->
    <g filter="url(#iconNeonGlow)">
      <!-- Left Page Exterior -->
      <path d="M 90 148 Q 58 138 28 144 L 38 98 Q 66 94 90 106 Z" fill="rgba(6, 182, 212, 0.25)" stroke="url(#iconBookCyan)" stroke-width="3"/>
      <!-- Right Page Exterior -->
      <path d="M 90 148 Q 122 138 152 144 L 142 98 Q 114 94 90 106 Z" fill="rgba(192, 132, 252, 0.25)" stroke="url(#iconBookPink)" stroke-width="3"/>
      <!-- Book Spine -->
      <line x1="90" y1="106" x2="90" y2="150" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

      <!-- Left Page Internal Text Rays -->
      <path d="M 46 112 Q 68 108 84 116" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 44 122 Q 68 118 84 126" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 42 132 Q 68 128 84 136" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- "EZ" on Right Page -->
      <text x="116" y="130" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="1">EZ</text>
    </g>
  </g>
</svg>
